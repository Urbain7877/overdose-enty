
name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x

    - name: Build Project
      run: dotnet build -c Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: MyLethalMod
        path: "**/bin/Release/netstandard2.1/*.dll"
